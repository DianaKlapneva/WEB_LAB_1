<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Faity Tiles</title>
</head>
<body>
    <header>
        <h3>Faity Tiles</h3>
    </header>

    <button id="order" popovertarget="orderform">Оформить заказ</button>

    <div id="orderform" popover>
        <button popovertarget="orderform" popovertargetaction="hide">
            <span aria-hidden="true"></span>
            <span class="sr-only">Закрыть</span>
        </button>
        <p>Оформление заказа</p>

        <input id="firstname" type="text" placeholder="Имя">
        <br><br>
        <input id="lastname" type="text" placeholder="Фамилия">
        <br><br>
        <input id="address" type="text" placeholder="Адрес">
        <br><br>
        <input id="phonenumber" type="tel" placeholder="+7XXXXXXXXXX">
        <br><br>
        <button id="submit" disabled onclick="
                const popup=this.closest('[popover]');
                const originalContent=popup.innerHTML;
                popup.innerHTML=`
            <button popovertarget='orderform' popovertargetaction='hide'>
                <span aria-hidden='true'></span>
                <span class='sr-only'>Закрыть</span>
            </button>
            <p>Заказ оформлен</p>
        `;

        // Возвращаем форму на след. раз
        popup.addEventListener('toggle', function(event) {
            if (event.newState === 'open') {
                popup.innerHTML = originalContent;
            }
        });
    ">Подтвердить заказ</button>
    </div>

    <script>
        // Ждем загрузки DOM
        document.addEventListener('DOMContentLoaded', function() {
            const firstname = document.getElementById('firstname');
            const lastname = document.getElementById('lastname');
            const address = document.getElementById('address');
            const phonenumber = document.getElementById('phonenumber');
            const submit = document.getElementById('submit');
            const orderButton = document.getElementById('order'); // Добавлено
            const orderForm = document.getElementById('orderform'); // Добавлено

            function validateInputs() {
                submit.disabled = !(firstname.value.trim() && 
                                  lastname.value.trim() && 
                                  address.value.trim() && 
                                  phonenumber.value.trim());
            }

            firstname.addEventListener('input', validateInputs);
            lastname.addEventListener('input', validateInputs);
            address.addEventListener('input', validateInputs);
            phonenumber.addEventListener('input', validateInputs);

            // Это отключаем изначальные настройки popover тк он уходит если снова нажать кнопку
            orderForm.addEventListener('beforetoggle', function(event) {
                if (event.newState === 'closed') {
                    // Проверяем, было ли событие инициировано кнопкой "Оформить заказ"
                    if (event.originalEvent && event.originalEvent.target === orderButton) {
                        event.preventDefault();
                    }
                }
            });

            // Доп защита - предотвращаем клик по кнопке когда форма открыта
            orderButton.addEventListener('click', function(event) {
                if (orderForm.matches(':popover-open')) {
                    event.preventDefault();
                    event.stopPropagation();
                    event.stopImmediatePropagation();
                }
            });
        });
    </script>
</body>
</html>
